# Redeploys https://adnan.si/allhours-bar/ when website/ changes on master.
# The server pulls master and builds it (/usr/local/bin/deploy-allhours-bar). The key in DEPLOY_SSH_KEY is
# authorized there with a forced command, so it can run that script and nothing else.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_HOST (the origin's IP, kept out of the repo because the
# site is behind Cloudflare) and DEPLOY_KNOWN_HOSTS (its host key line).
name: Website

on:
  push:
    branches: [master]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Deploy secrets aren't set, so the website was not deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$HOST"
